name: KineShootRemote
options:
  bundleIdPrefix: com.koreever66
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  KineShootRemote:
    type: application
    platform: iOS
    sources:
      - KineShootRemote
    info:
      path: KineShootRemote/Info.plist
      properties:
        CFBundleDisplayName: KineShoot
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "9"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: "Connect to the KineShoot capture device and start IMU recording."
        NSBluetoothPeripheralUsageDescription: "Connect to the KineShoot capture device and start IMU recording."
        NSCameraUsageDescription: "Record synchronized basketball shooting videos."
        NSMicrophoneUsageDescription: "Record audio together with synchronized basketball shooting videos."
        NSPhotoLibraryUsageDescription: "Access the photo library when saving recorded capture videos."
        NSPhotoLibraryAddUsageDescription: "Save recorded capture videos to Photos."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koreever66.KineShootRemote
        PRODUCT_NAME: KineShootRemote
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
